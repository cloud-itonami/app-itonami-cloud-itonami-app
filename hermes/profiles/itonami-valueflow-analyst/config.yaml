# Host-local blocks (command_allowlist, onboarding, secrets, skills, terminal) are kept on the host and omitted here.
model:
  provider: awai-node
  base_url: http://127.0.0.1:11434/v1
  default: local
  max_tokens: 8192
  context_length: 131072
providers:
  awai-node:
    base_url: http://127.0.0.1:11434/v1
    api_mode: chat_completions
    stale_timeout_seconds: 600
    request_timeout_seconds: 900
fallback_providers: []
auxiliary:
  free_only: true
  vision:
    provider: awai-node
    base_url: http://127.0.0.1:11434/v1
    model: qwen3-vl-2b-instruct
    reasoning_effort: none
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
  web_extract:
    base_url: http://127.0.0.1:11434/v1
    model: local
    provider: awai-node
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
  compression:
    base_url: http://127.0.0.1:11434/v1
    model: local
    provider: awai-node
    reasoning_effort: none
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
  skills_hub:
