    model: local
    provider: awai-node
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
  approval:
    base_url: http://127.0.0.1:11434/v1
    model: local
    provider: awai-node
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
  mcp:
    base_url: http://127.0.0.1:11434/v1
    model: local
    provider: awai-node
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
  title_generation:
    base_url: http://127.0.0.1:11434/v1
    model: local
    provider: awai-node
    reasoning_effort: none
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
  triage_specifier:
    base_url: http://127.0.0.1:11434/v1
    model: local
    provider: awai-node
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
agent:
