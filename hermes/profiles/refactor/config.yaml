providers:
  awai-node:
    base_url: http://127.0.0.1:11434/v1
    api_mode: chat_completions
    stale_timeout_seconds: 600
    request_timeout_seconds: 900
model:
  provider: awai-node
  base_url: http://127.0.0.1:11434/v1
  default: local
  max_tokens: 8192
  context_length: 131072
auxiliary:
  free_only: true
  vision:
    provider: awai-node
    base_url: http://127.0.0.1:11434/v1
    model: qwen3-vl-2b-instruct
    reasoning_effort: none
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
  web_extract:
    base_url: http://127.0.0.1:11434/v1
    model: local
    provider: awai-node
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
  compression:
    base_url: http://127.0.0.1:11434/v1
    model: local
    provider: awai-node
    reasoning_effort: none
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
  skills_hub:
    base_url: http://127.0.0.1:11434/v1
    model: local
    provider: awai-node
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
  approval:
    base_url: http://127.0.0.1:11434/v1
    model: local
    provider: awai-node
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
  mcp:
    base_url: http://127.0.0.1:11434/v1
    model: local
    provider: awai-node
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
  title_generation:
    base_url: http://127.0.0.1:11434/v1
    model: local
    provider: awai-node
    reasoning_effort: none
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
  triage_specifier:
    base_url: http://127.0.0.1:11434/v1
    model: local
    provider: awai-node
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
fallback_providers: []
plugins:
  enabled: []
gateway:
  cron_only: true
  multiplex_profiles: true
_config_version: 46
agent:
  max_turns: 500
  run_budget_seconds: 600
cron:
  bot_chat_delivery_timeout_seconds: 900
  max_parallel_jobs: 12

compression:
  threshold_tokens: 20000
  proactive_prune_tokens: 16000
  tail_mode: lean
